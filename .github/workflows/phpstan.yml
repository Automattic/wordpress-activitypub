name: PHPStan
on:
  push:
    branches:
      - trunk
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpstan.neon.dist'
      - 'phpstan-baseline.neon'
      - 'tests/phpstan/**'
      - '.github/workflows/phpstan.yml'
      - '!build/**/*.asset.php'
  pull_request:
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpstan.neon.dist'
      - 'phpstan-baseline.neon'
      - 'tests/phpstan/**'
      - '.github/workflows/phpstan.yml'
      - '!build/**/*.asset.php'
permissions:
  contents: read
jobs:
  phpstan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install Composer dependencies for PHP
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
      - name: Analyse
        run: composer analyze -- --no-progress --error-format=github
      - name: Test PHPStan extension
        run: composer analyze:test

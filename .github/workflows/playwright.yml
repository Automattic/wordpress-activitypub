name: Playwright E2E Testing

on:
  push:
    branches:
      - trunk
    paths:
      - 'tests/e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.wp-env.json'
      - '.github/workflows/playwright.yml'
      - 'includes/rest/**'
  pull_request:
    paths:
      - 'tests/e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.wp-env.json'
      - '.github/workflows/playwright.yml'
      - 'includes/rest/**'

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start WordPress environment
        run: npm run env-start

      - name: Log running Docker containers
        run: docker ps -a

      - name: Configure permalinks
        run: |
          echo "Configuring pretty permalinks..."
          npm run env -- run tests-cli wp rewrite structure '/%year%/%monthnum%/%postname%/'
          npm run env -- run tests-cli wp rewrite flush
          echo "Verifying permalink structure..."
          npm run env -- run tests-cli wp rewrite list

      - name: Run Playwright tests
        run: npm run test:e2e

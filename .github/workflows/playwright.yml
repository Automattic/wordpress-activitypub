name: Playwright E2E Testing

on:
  push:
    branches:
      - trunk
    paths:
      - 'tests/e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.wp-env.json'
      - '.github/workflows/playwright.yml'
      - 'includes/rest/**'
  pull_request:
    paths:
      - 'tests/e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.wp-env.json'
      - '.github/workflows/playwright.yml'
      - 'includes/rest/**'

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright browsers from cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers and dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Cache wp-env directory
        uses: actions/cache@v4
        with:
          path: ~/wp-env
          key: ${{ runner.os }}-wp-env-${{ hashFiles('.wp-env.json') }}
          restore-keys: |
            ${{ runner.os }}-wp-env-

      - name: Cache Docker images
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: ${{ runner.os }}-docker-${{ hashFiles('.wp-env.json') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          for image in /tmp/docker-images/*.tar; do
            [ -f "$image" ] && docker load -i "$image"
          done

      - name: Start WordPress environment
        run: npm run env-start

      - name: Save Docker images to cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-images
          docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "^(wordpress|mariadb|phpmyadmin)" | while read image; do
            docker save "$image" -o "/tmp/docker-images/$(echo $image | tr ':/' '--').tar"
          done

      - name: Run Playwright tests
        run: npm run test:e2e

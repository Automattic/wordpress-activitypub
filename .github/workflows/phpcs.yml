name: PHP_CodeSniffer
on:
  push:
    branches:
      - trunk
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
      - 'phpcs.xml'
      - '.github/workflows/phpcs.yml'
      - '!build/**/*.asset.php'
  pull_request:
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
      - 'phpcs.xml'
      - '.github/workflows/phpcs.yml'
      - '!build/**/*.asset.php'
jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '7.4'
          coverage: none
          tools: composer, cs2pr
      - name: Install Composer dependencies for PHP
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
      - name: Detect coding standard violations
        run: ./vendor/bin/phpcs

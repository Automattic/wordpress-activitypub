name: Auto Format PR

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'trunk'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run formatter
        run: npm run format

      - name: Check for changes and commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');
            const { repo: { owner, repo }, payload: { pull_request: { head: { ref } } } } = context;

            // Check if there are any changes
            try {
              const status = execSync('git status --porcelain', { encoding: 'utf8' }).trim();
              
              if (!status) {
                core.info('No formatting changes needed');
                return;
              }

              core.info('Formatting changes detected, committing files...');

              // Get list of changed files
              const changedFiles = status.split('\n').map(line => line.slice(3).trim());
              
              // Create or update each file using GitHub API
              for (const filePath of changedFiles) {
                try {
                  const fileContent = require('fs').readFileSync(filePath, 'utf8');
                  const base64Content = Buffer.from(fileContent).toString('base64');
                  
                  // Get current file SHA if it exists
                  let sha;
                  try {
                    const { data: currentFile } = await github.rest.repos.getContent({
                      owner,
                      repo,
                      path: filePath,
                      ref: ref
                    });
                    sha = currentFile.sha;
                  } catch (error) {
                    // File might be new, continue without SHA
                  }

                  await github.rest.repos.createOrUpdateFileContents({
                    owner,
                    repo,
                    path: filePath,
                    message: 'Prettify',
                    content: base64Content,
                    branch: ref,
                    ...(sha && { sha })
                  });

                  core.info(`Updated file: ${filePath}`);
                } catch (error) {
                  core.error(`Failed to update ${filePath}: ${error.message}`);
                }
              }

            } catch (error) {
              core.setFailed(`Error during formatting: ${error.message}`);
            }